[project]
name = "cacl-compiler"
version = "0.1.0"
description = "Standalone compiler, analyzer, decompiler, and evaluator for CFMS Access Control Language (CEP 2)."
readme = "README.md"
authors = [
    { name = "Creeper19472", email = "creeper19472@crpteam.club" }
]
requires-python = ">=3.15"
dependencies = [
    "lark>=1.3.1",
]

[project.scripts]
caclc = "cacl_compiler.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
